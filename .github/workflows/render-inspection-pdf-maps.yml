name: Render inspection source PDFs
on:
  push:
    branches:
      - temp/render-inspection-pdf-maps
    paths:
      - '.github/workflows/render-inspection-pdf-maps.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
      - name: Install PDF and OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr
      - name: Render PDFs and OCR point labels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rendered
          shopt -s nullglob
          for pdf in docs/*.pdf; do
            base="$(basename "${pdf%.pdf}" | tr ' ()' '___' | tr -cd '[:alnum:]_.-')"
            echo "Processing: $pdf"
            pdfinfo "$pdf" > "rendered/${base}_info.txt"
            pdftoppm -png -r 250 "$pdf" "rendered/${base}"
            for page in rendered/"${base}"-*.png; do
              tesseract "$page" "${page%.png}" -l eng --psm 11 tsv
            done
          done
          find rendered -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
      - name: Upload rendered maps and OCR coordinates
        uses: actions/upload-artifact@v4
        with:
          name: inspection-map-ocr-250dpi
          path: rendered/
          if-no-files-found: error
          retention-days: 3
